# Render Blueprint — deploy Kisan Mitra as a free Node web service.
services:
  - type: web
    name: kisan-mitra
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false      # Optional for the demo; app falls back to in-memory data.
      - key: GEMINI_API_KEY
        sync: false      # Optional; AI assistant uses fallback behavior when absent.
      - key: JWT_SECRET
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: DATA_GOV_IN_RESOURCE_ID
        sync: false
      - key: CORS_ORIGIN
        sync: false
